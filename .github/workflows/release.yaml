# Publish to PyPI
#
# Builds the sdist + wheel and publishes them to PyPI when a GitHub Release is
# published.
#
# Authentication uses PyPI Trusted Publishing (OIDC) rather than a stored API
# token, so no secrets need to be configured in this repository. This requires a
# one-time setup on PyPI: add a "pending"/trusted publisher for this project
# pointing at:
#   Owner:        mwatson2
#   Repository:   pygaposa
#   Workflow:     release.yaml
#   Environment:  pypi
# See https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#
# Release process:
#   1. Bump `version` in pygaposa/__meta__.py and update CHANGELOG.rst (on a PR).
#   2. After merging, create a GitHub Release with tag `v<version>`
#      (e.g. v0.2.5). Publishing the release triggers this workflow.

name: release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        run: |
          PKG_VERSION=$(python -c "meta = {}; exec(open('pygaposa/__meta__.py').read(), meta); print(meta['version'])")
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          echo "Package version: $PKG_VERSION"
          echo "Release tag:     $TAG (normalized: $TAG_VERSION)"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package version '$PKG_VERSION'. Update pygaposa/__meta__.py or the tag."
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pygaposa
    permissions:
      # Required for Trusted Publishing (OIDC). No PyPI token needed.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
